name: Introduce yourself
description: Say hi to the OpenYard community.
title: "[Join] "
labels: ["join-team"]
body:
  - type: markdown
    attributes:
      value: Happy to have you. Tell us a bit about yourself and what you are making.
  - type: dropdown
    id: role
    attributes:
      label: What do you do?
      multiple: true
      options:
        - Development
        - Design
        - Translation
        - Testing
        - Ideas and user research
        - Something else
    validations:
      required: true
  - type: textarea
    id: about
    attributes:
      label: A few lines about you and what you'd like to work on
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: Discord username or another way to reach you (optional)
